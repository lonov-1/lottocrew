<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LottoCrew</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f5f7fb;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:bold;
font-size:22px;
color:#4A6CF7;
}

button{
background:#4A6CF7;
color:white;
border:none;
padding:10px 16px;
border-radius:6px;
cursor:pointer;
}

.pool{
background:white;
padding:20px;
border-radius:10px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

</style>

</head>

<body>

<div class="container">

<header>

<div class="logo">LottoCrew</div>

<button>Create Pool</button>

</header>

<h2>Public Pools</h2>

<div class="pool">

<h3>Vienna Lotto Pool</h3>

<p>Members: 12 / 50</p>

<button>Join</button>

</div>

<div class="pool">

<h3>Eurojackpot Community</h3>

<p>Members: 34 / 100</p>

<button>Join</button>

</div>

</div>

</body>
</html>
